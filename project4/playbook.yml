---
- name: Tags and conditionals demo
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install package on RedHat-based systems (dnf)
      dnf:
        name: git
        state: present
      when: ansible_facts['os_family'] == "RedHat"
      tags:
        - install

    - name: Install package on Debian-based systems (apt)
      apt:
        name: git
        state: present
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - install

    - name: Show current OS family (always runs, useful for debugging)
      debug:
        msg: "This system is: {{ ansible_facts['os_family'] }}"
      tags:
        - info

    - name: Create a config directory
      file:
        path: /tmp/demo-config
        state: directory
        mode: "0755"
      tags:
        - config

    - name: Write a sample config file
      copy:
        dest: /tmp/demo-config/app.conf
        content: |
          environment=production
          debug=false
      tags:
        - config

    - name: Print a message confirming the run (restart-like simulated step)
      debug:
        msg: "Service would be restarted here if this were a real app"
      tags:
        - restart
